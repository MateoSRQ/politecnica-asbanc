# ====================================================================
# Configuración Nginx Perimetral: Politécnica ASBANC FTR
# Terminación TLS 1.2/1.3, Whitelisting de IPs ASBANC y Reverse Proxy
# ====================================================================

# 1. Definición de IPs autorizadas de ASBANC (Lista Blanca)
geo $asbanc_allowed {
    default 0;
    127.0.0.1 1;          # Localhost / pruebas internas
    10.0.0.0/8 1;         # Red interna / VPN bancaria
    172.16.0.0/12 1;      # Rango privado
    # 200.48.x.x 1;       # Reemplazar con IPs públicas oficiales de ASBANC
}

upstream asbanc_backend {
    # Socket o puerto del clúster Fastify (PM2)
    server 127.0.0.1:7300;
    keepalive 64;
}

server {
    listen 7300 ssl http2;
    # o listen 443 ssl http2;
    server_name asbanc.politecnica.edu.pe;

    # Certificados SSL/TLS (Emitidos por CA autorizada según Pág. 8 Guía V47)
    ssl_certificate /etc/ssl/certs/politecnica_asbanc.crt;
    ssl_certificate_key /etc/ssl/private/politecnica_asbanc.key;

    # Cifrado seguro exigido por ASBANC (Deshabilitar SSLv3, TLS 1.0, 1.1, RC4, 3DES)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Filtrado estricto por IP
    if ($asbanc_allowed = 0) {
        return 403 '{"codigoRespuesta":"99","descripcionResp":"ACCESO DENEGADO: IP NO AUTORIZADA"}';
    }

    # Proxy hacia el microservicio Fastify
    location / {
        proxy_pass http://asbanc_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts estrictos para cumplimiento de SLA (< 3s)
        proxy_connect_timeout 3s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;

        # Buffer optimizado para APIs JSON
        proxy_buffering off;
    }
}
